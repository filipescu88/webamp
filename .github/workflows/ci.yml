name: Testy

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalacja pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9.12.0
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - name: Instalacja zależności
        run: pnpm install --frozen-lockfile
      - name: Budowanie
        run: npx turbo build
        env:
          NODE_ENV: production
      - name: Lint i sprawdzanie typów
        run: npx turbo lint type-check
      - name: Testy
        run: npx turbo test -- --maxWorkers=2
        env:
          NODE_ENV: test
