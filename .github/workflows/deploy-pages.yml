name: Publikacja strony na GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalacja pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9.12.0
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Instalacja zależności
        run: pnpm install --frozen-lockfile
      - name: Budowanie strony
        run: npx turbo build --filter=webamp-demo
        env:
          NODE_ENV: production
      - name: Wysłanie plików strony
        uses: actions/upload-pages-artifact@v3
        with:
          path: packages/webamp-demo/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
